# Xilinx AXI Ethernet (the MRMAC ports bind to this driver) + MCDMA datapath.
# axienet (XILINX_AXI_EMAC) ioremaps the MCDMA itself (AXIENET_HAS_MCDMA) but
# Kconfig-depends on XILINX_DMA, so the standalone xilinx_dma dmaengine driver
# is necessarily built in and can't be turned off here. To stop it from
# claiming the MCDMA region first (which makes axienet's probe fail -EBUSY),
# the MCDMA nodes' compatible is overridden in port-config.dtsi to a string
# xilinx_dma doesn't match.
CONFIG_NET_VENDOR_XILINX=y
CONFIG_XILINX_AXI_EMAC=y
CONFIG_AXIENET_HAS_MCDMA=y
# AXI GPIO (GT control + MOD_ABS) and AXI IIC (FMC PCA9548 mux)
CONFIG_GPIO_XILINX=y
CONFIG_I2C_XILINX=y
# PCA9548 I2C mux on the FMC card (ch0-3 = SFP module I2C, ch4 = Si5328)
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y
# Kernel SFP framework for the four cages (module presence via the
# axi_gpio_modabs mod-def0-gpios, EEPROM + diagnostics over the mux). The
# MRMAC/axienet driver has no phylink, so the cages are standalone management
# devices - not linked to the MACs.
CONFIG_SFP=y
CONFIG_MDIO_I2C=y
